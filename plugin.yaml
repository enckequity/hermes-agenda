name: agenda
version: "1.0.1"
author: Zubair Shaik
requires_hermes: ">=0.23.0"
description: "The agent's running todo list: shown every turn, one `agenda` tool to add/tick/drop/snooze/edit/search; closed items go to a searchable archive. It never schedules jobs itself; due items are raised in conversation."
provides_hooks:
  - pre_llm_call
provides_tools:
  - agenda
config_schema:
  timezone:
    type: string
    default: ""
    label: Timezone
    description: IANA timezone for item times (e.g. Europe/London). Empty uses the system timezone.
  user_name:
    type: string
    default: "the user"
    label: Your name
    description: Who the agent works for; shown on items they own and in reminder prompts.
  max_tokens:
    type: integer
    default: 300
    label: Context budget (tokens)
    description: Max size of the per-turn injection (about 4 chars per token). Only items due within 24h are injected (max 3, then a count); nothing due means nothing injected. `agenda list` shows everything.
  reminders:
    type: string
    default: "off"
    label: Hard-deadline alarms
    description: "Always off: the agenda never creates scheduled jobs. For a hard deadline the assistant offers a scheduled job, which you confirm first."
